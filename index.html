/* 时间风险表 */
function timeTable(a){
  if(a<0.3)return {days:">30天",risk:"低"};
  if(a<0.5)return {days:"14-30天",risk:"低"};
  if(a<0.7)return {days:"7-14天",risk:"中"};
  if(a<0.9)return {days:"3-7天",risk:"高"};
  return {days:"<3天",risk:"极高"};
}

const TALK = {
  "面子":  {stage:"阶段2·给台阶", tip:"核心是给对方体面收场的台阶，不说『错』只说『可能』，肯定双方价值"},

  "程序":  {stage:"阶段1+2·去黑箱", tip:"核心是公开透明、给出说法，先消解『流程不公感』再谈事"}
};

/* 调解话术三阶段库 */

/* 39案例库精选（可匹配） */
const CASES = [
  {id:12,t:"四年积案·邻里土地纠纷",type:"ZR-E",kw:["土地","信访","邻里","积案"],sol:"『信访-调解』闭环：政府最小介入(S1)→双方自行和解；背靠背摸底后促成书面了结"},
  {id:18,t:"八年土地纠纷·背靠背调解",type:"ZR-E",kw:["土地","八年","背靠背","积案"],sol:"背靠背破信息不对称：分别听诉求→引到平等和解→书面闭环"},

  {id:13,t:"一条公用道十年邻里战争",type:"ZR-E",kw:["公用","通道","道路","邻里"],sol:"政府调而不判：背靠背→双方让步各留余地→书面协议"},
  {id:39,t:"西瓜皮引发邻里大战·沟通缺位",type:"ZR-E",kw:["邻居","沟通","小事","误会"],sol:"先翻译闹挖出真需求→第一时间破沟通缺位→给台阶收场"},
  {id:3,t:"广西大化五字工作法·历史通道",type:"CR-E",kw:["历史","通道","共损","五字"],sol:"五字工作法流程化：共损型先止损→再协商程序→闭环"},
  {id:10,t:"保险拒赔·综治调解",type:"CR-E",kw:["保险","拒赔","赔偿"],sol:"保险框架清晰：按条款定责→共损避免两败→争取合理赔付"},
  {id:7,t:"六步工作法调解邻里纠纷",type:"CR-E",kw:["六步","邻里"],sol:"六步工作法：摸底→定性→分别劝和→协商→书面→回访"},
  {id:14,t:"菜单式矛盾调处·共益设计",type:"CB-E",kw:["菜单","共益","选择"],sol:"群众点菜政府送餐：提供多方案让双方选，帕累托最优路径"},
  {id:29,t:"六尺巷工作法·租赁纠纷",type:"CB-E",kw:["租赁","六尺巷","情法"],sol:"六尺巷文化调和：『让一步海阔天空』→情法两解"},
  {id:31,t:"四年连环纠纷·溯源调解",type:"CB-U",kw:["连环","溯源","多起"],sol:"溯源调解：找矛盾根源→一起解决，避免按下葫芦浮起瓢"},
  {id:4,t:"56户建房纠纷·群体利益",type:"ZR-U",kw:["建房","群体","多户","56"],sol:"群体利益冲突：政府主导(S2)→分户差异化处理→防抱团激化"},
  {id:19,t:"油罐车三方连环纠纷",type:"CR-P",kw:["油罐","三方","连环"],sol:"三方+信息不对称：先转虚拟完全信息→注入调解员偏好→三方共同方案"},
  {id:17,t:"婚恋纠纷·隐蔽化反复化",type:"MX-A",kw:["婚","情感","反复"],sol:"情感利益不可量化不建模：走经验+认知层，先彻查反复根源再谈"},
  {id:28,t:"遗产纠纷·案结家不散",type:"MX-A",kw:["遗产","家事","兄弟"],sol:"案结≠家不散：先顾感情→再分财产，防止赢了官司散了家"}

/* ============ 判据引擎 ============ */
function estimate(ans){
  // r 迫切度: 主要看Q2升级程度 + Q3
  let r=0;
  if(ans.q2>=1)r+=0.1;
  if(ans.q2>=2)r+=0.3;
  if(ans.q2>=3)r+=0.5;
  if(ans.q2>=4)r+=0.7;
  if(ans.q2>=5)r+=0.9;
  r+=ans.q3*0.05;
  if(ans.q3>=3)r+=0.1;
  r=Math.min(1,r);
  // a 不可收拾度: Q2 + Q5谈崩
  let a=0;
  a+=ans.q2*0.12;
  a+=ans.q5*0.08;
  if(ans.q2>=4)a+=0.15;
  if(ans.q2>=5)a+=0.2;
  if(ans.q5>=3)a+=0.1;
  a=Math.min(1.1,a);
  return {r,a};
}

function judge(ans){
  const {r,a}=estimate(ans);
  const tt=timeTable(Math.min(a,0.99));
  // L1 想动手
  const L1=r>=0.45;
  // L2 还没不可收拾
  const L2=a<0.7;
  // L3 差距不太大
  const L3=Math.abs(ans.q3-2)<=1.5;
  // L4 信息够不够
  const L4=ans.q4===1;
  // L5 传递层级 <=2（问答5结合场景隐式）
  const L5=ans.q2<=3;
  // 五态判定
  let state,stateHint;
  if(ans.q2>=4){ state="🔴 提前关闭（应急）"; stateHint="已发生聚集/动手/堵路甚至上访，危机状态，话术让位于安全+上报名，不强行调解。"; }
  else if(!L1){ state="🟢 未启动"; stateHint="各方还没到『想动手』的程度，窗口未开，监测+建立联系。"; }
  else if(L1&&L2&&L3&&L5){ state="🟢 窗口打开（最佳）"; stateHint="标准调解流程：先情后利→给台阶→固化条款。"; }
  else if(L1&&L2&&!L4){ state="🟡 窗口收窄（加速）"; stateHint="信息不足，先摸底挖真需求，再定调解方案，直接开会易失败。"; }
  else if(!L2){ state="🟠 窗口关闭"; stateHint="已到不可收拾，标准调解失效，转制度渠道（上报/裁决），但认真对待诉求。"; }
  else { state="🟢 窗口打开（可调）"; stateHint="存在可调空间，走标准调解流程。"; }
  return {L1,L2,L3,L4,L5,state,stateHint,r,a,tt};
}

/* 案例匹配 */
function matchCases(ans){
  const txt=ans.desc||"";
  const scene=SCENES[ans.scene]||{};
  const sceneWords=scene.keywords||[];
  const all=sceneWords.join(" ");
  return CASES.filter(c=>{
    let score=0;
    c.kw.forEach(k=>{ if(all.includes(k)||txt.includes(k))score++; });
    return score>0 || c.type.includes(ans.typeGuess||"");
  }).slice(0,3);
}

/* ============ UI 构建 ============ */
const sceneTabs=document.getElementById("sceneTabs");
Object.keys(SCENES).forEach(k=>{
  const b=document.createElement("button");
  b.className="tab"; b.textContent=SCENES[k].name; b.dataset.scene=k;
  b.onclick=()=>selectScene(k,b);
  sceneTabs.appendChild(b);
});
let selScene="yiqi"; let selTab=null;
function selectScene(k,b){
  selScene=k;
  document.querySelectorAll(".tabs .tab").forEach(x=>x.classList.remove("active"));
  b.classList.add("active"); selTab=b;
  document.getElementById("sceneDesc").textContent=SCENES[k].desc;
  buildQuiz();
}
selectScene("yiqi",sceneTabs.firstChild);

function buildQuiz(){
  const q=document.getElementById("quiz");
  q.innerHTML="";
  // 描述输入
  q.innerHTML+='<label>描述一下矛盾情况（选填，用于案例匹配）</label><textarea id="qDesc" rows="2" placeholder="例如：两家为院墙位置吵了多年，最近又动起手来"></textarea>';
  // Q1 类型（预填场景类型，可改）
  q.innerHTML+='<label>矛盾核心性质</label><div class="radios" id="qType"></div>';
  ["利益纠纷","面子纠纷","情绪纠纷","程序纠纷"].forEach(t=>{
    const inp='<label><input type="radio" name="qtype" value="'+t+'"> '+t+'</label>';
    document.getElementById("qType").insertAdjacentHTML("beforeend",inp);
  });
  // 预选场景对应类型
  const defType=SCENES[selScene].type+"纠纷";
  document.querySelectorAll('input[name=qtype]').forEach(x=>{ if(x.value===defType)x.checked=true; });
  // Q2-Q5
  const items=[
    {id:"q2",label:"升级程度：现在到哪一步了？",opts:ENG.Q2},
    {id:"q3",label:"双方状态：谁更着急？",opts:ENG.Q3},
    {id:"q4",label:"信息清晰度：双方诉求摸清了吗？",opts:ENG.Q4},
    {id:"q5",label:"谈过几次？",opts:ENG.Q5}
  ];
  items.forEach(it=>{
    let html='<label>'+it.label+'</label><div class="radios">';
    it.opts.forEach(o=>{ html+='<label><input type="radio" name="'+it.id+'" value="'+o.v+'"> '+o.t+'</label>'; });
    html+='</div>';
    q.insertAdjacentHTML("beforeend",html);
  });
  // 默认选中第一项
  ["q2","q3","q4","q5"].forEach(id=>{ document.querySelector('input[name='+id+'][value="1"]').checked=true; });
  document.querySelector('input[name=q5][value="0"]').checked=true;
}

document.getElementById("runBtn").onclick=run;

function readAns(){
  const getV=(n)=>{ const e=document.querySelector('input[name='+n+']:checked'); return e?parseInt(e.value):null; };
  const getType=()=>{ const e=document.querySelector('input[name=qtype]:checked'); return e?e.value.replace("纠纷",""):"利益"; };
  return {
    scene:selScene, desc:document.getElementById("qDesc").value,
    type:getType(), q2:getV("q2"), q3:getV("q3"), q4:getV("q4"), q5:getV("q5")
  };
}

function run(){
  const ans=readAns();
  if(ans.q2===null){ alert("请完成问卷"); return; }
  const J=judge(ans);
  const typeName=ans.type+"纠纷";
  const talk=TALK[ans.type]||TALK["利益"];
  const cases=matchCases(ans);
  const res=document.getElementById("result");

  document.getElementById("rBadge").textContent=J.tt.risk;
  document.getElementById("rBadge").className="badge "+J.tt.risk;

  let h="";
  // 风险仪表盘
  h+='<div class="gauge"><div class="lbl">风险级别</div><div class="val">'+J.tt.risk+'</div><div class="lbl">剩余窗口</div><div class="val">'+J.tt.days+'</div></div>';
  h+='<div class="metric">';
  h+='<div class="mbox"><div class="k">矛盾类型</div><div class="v">'+typeName+'</div></div>';
  h+='<div class="mbox"><div class="k">调解窗口状态</div><div class="v">'+J.state+'</div></div>';
  h+='<div class="mbox"><div class="k">迫切度 r='+J.r.toFixed(2)+'</div><div class="v">'+(J.L1?"已触发介入":"未触发")+'</div></div>';
  h+='<div class="mbox"><div class="k">不可收拾度 a='+J.a.toFixed(2)+'</div><div class="v">'+(J.L2?"尚可调解":"不可收拾")+'</div></div>';
  h+='</div>';
  // 高危警示
  if(!J.L2){
    h+='<div class="warn"><b>⚠️ 高危预警：</b>已到'+J.state+'，需立即按制度渠道上报/应急，不得仅建议自行调解。</div>';
  }
  // 路径
  h+='<div class="sec">🎯 调解路径（'+J.state+'）</div>';
  h+='<p style="font-size:14px;color:#555">'+J.stateHint+' '+talk.tip+'</p>';
  // 话术侧重
  h+='<div class="sec">🗣️ 分阶段话术（侧重：'+talk.stage+'）</div>';
  h+='<div class="steps">';
  const stages= J.state.includes("提前关闭")||J.state.includes("关闭")
    ? ["阶段3·固化条款"]
    : ["阶段1·先情后利","阶段2·给台阶","阶段3·固化条款"];
  stages.forEach((s,n)=>{
    if(J.state.includes("收窄")&&s==="阶段1·先情后利"){h+='<div class="st"><b>'+s+'（加速·压缩）</b> 窗口收窄，没时间慢慢处理情绪，直接进给台阶环节。</div>';return;}
    const lines=LIB[s];
    if(lines){h+='<div class="st"><b>'+s+'</b>';lines.forEach(l=>{h+='<div style="margin-top:4px;color:#444">· '+l+'</div>';});h+='</div>';}
  });
  h+='</div>';
  // 案例匹配
  if(cases.length){
    h+='<div class="sec">📚 相似参考案例</div>';
    cases.forEach(c=>{
      h+='<div class="casebox"><div class="t">#'+c.id+' '+c.t+' <span class="pill">'+c.type+'</span></div><div class="m">'+c.sol+'</div></div>';
    });
  }
  document.getElementById("rContent").innerHTML=h;
  res.classList.add("show");
  document.getElementById("gmcrBox").innerHTML="";
}

/* ============ GMCR 稳定性判断（专业） ============ */
document.getElementById("proBtn").onclick=function(){
  const ans=readAns();
  const J=judge(ans);
  const box=document.getElementById("gmcrBox");
  if(!J.L2 || J.a>=0.7){
    box.innerHTML='<div class="warn"><b>不适合 GMCR 建模：</b>矛盾已到不可收拾或危机状态，稳定性分析无意义，优先上报/应急。</div>';
    return;
  }
  const enc=encodeGMCR(ans);
  box.innerHTML=enc;
};

function encodeGMCR(ans){
  // 简化 GMCR：基于类型确定利益结构 + 信息维度 + 稳定性推演
  const A= ans.type==="面子" ? (ans.q3>=3?"共损CR":"零和ZR")
          : ans.type==="情绪" ? "共损CR"
          : ans.type==="程序" ? "混合MX" : "零和ZR";
  const B= ans.q4===1 ? "完全信息E" : (ans.q4===2?"部分信息U":"模糊A");
  const N= ans.q2>=4 ? "网络型N>7(不建模)" : "双边N≤3(可建模)";
  const stable= J.a<0.5 ? "存在稳定均衡（可调）" : "均衡不稳定（窗口收窄）";
  let h="";
  h+='<div class="sec">🔬 GMCR 博弈建模（专业模式）</div>';
  h+='<div class="metric">';
  h+='<div class="mbox"><div class="k">利益结构</div><div class="v">'+A+'</div></div>';
  h+='<div class="mbox"><div class="k">信息对称</div><div class="v">'+B+'</div></div>';
  h+='<div class="mbox"><div class="k">参与者规模</div><div class="v">'+N+'</div></div>';
  h+='<div class="mbox"><div class="k">均衡稳定性</div><div class="v" style="font-size:14px">'+stable+'</div></div>';
  h+='</div>';
  h+='<div class="hl">'+(J.a<0.5 ? "当前存在可实现的稳定解，建议走标准调解促成双方达成帕累托方案。" : "均衡在漂移，需在窗口关闭前介入，或转制度渠道。")+'</div>';
  return h;
}

document.getElementById("sceneTabs").firstChild.click();
</script>
